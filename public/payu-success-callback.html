<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SyncFound Payment Success</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #eef8f3 0%, #f7fcff 100%);
        color: #173d32;
      }
      .card {
        width: min(92vw, 520px);
        background: #ffffff;
        border: 1px solid #d7e8df;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }
      .title {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.3;
        font-weight: 700;
      }
      .subtitle {
        margin: 0 0 20px;
        color: #3d6658;
      }
      .meta {
        margin: 0 0 20px;
        font-size: 14px;
        color: #4c6d62;
        word-break: break-word;
      }
      .btn {
        width: 100%;
        min-height: 44px;
        border-radius: 999px;
        border: 0;
        background: #179468;
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 class="title">Payment Received</h1>
      <p class="subtitle">Redirecting you back to the app.</p>
      <p id="meta" class="meta">Preparing secure handoff...</p>
      <button id="openAppBtn" class="btn" type="button">Open SyncFound App</button>
    </main>

    <script>
      (function () {
        function readParams() {
          var url = new URL(window.location.href);
          return {
            checkout_session_id: (url.searchParams.get('checkout_session_id') || '').trim(),
            status: (url.searchParams.get('status') || 'success').trim(),
            txnid: (url.searchParams.get('txnid') || '').trim(),
            error_code: (url.searchParams.get('error_code') || '').trim(),
            error_message: (url.searchParams.get('error_message') || '').trim()
          };
        }

        function buildDeepLink(base, params) {
          var query = new URLSearchParams();
          Object.keys(params).forEach(function (key) {
            var value = String(params[key] || '').trim();
            if (value) {
              query.set(key, value);
            }
          });
          var suffix = query.toString();
          return suffix ? base + '?' + suffix : base;
        }

        var params = readParams();
        var deepLink = buildDeepLink('syncfound://payment/success', params);

        var metaEl = document.getElementById('meta');
        metaEl.textContent = 'Session: ' + (params.checkout_session_id || 'n/a') + ' | Txn: ' + (params.txnid || 'n/a');

        var open = function () {
          window.location.href = deepLink;
        };

        document.getElementById('openAppBtn').addEventListener('click', open);
        setTimeout(open, 250);
      })();
    </script>
  </body>
</html>
